name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pin the exact Node release (and with it the bundled npm, 11.19.1 for 24.22.3).
# package-lock.json is written by npm 11; npm 10 (Node 20/22) rejects it in
# `npm ci`. wrangler/miniflare also need Node >= 22.12. Bump deliberately and
# re-check `npm ci` with the new bundled npm when changing this.
env:
  NODE_VERSION: '24.22.3'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Build
        run: npm run build

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Type check
        run: npx tsc --noEmit
